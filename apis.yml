aid: meitu
name: Meitu
description: >-
  Meitu (美图) is a Chinese visual-technology company best known for its
  photo- and video-editing apps (Meitu, BeautyCam, Meitu Xiuxiu). It operates
  the Meitu AI Open Platform, which exposes 100+ image and video AI capabilities
  as a Web API (OpenAPI) plus native/mobile SDKs — image generation and editing,
  portrait beautification, face and body analysis, cutout and segmentation,
  virtual try-on, and image/text-to-video. Access uses a per-application access
  key and secret key signature; an official Node.js CLI (meitu-cli) wraps the
  OpenAPI. Surfaced as a portfolio company of Qiming and enriched by the API
  Evangelist pipeline.
